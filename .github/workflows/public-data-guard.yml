name: Public data guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject user data in the public repository
        shell: bash
        run: |
          blocked="$(git ls-files | grep -Ei '(^|/)data/|\.(db|sqlite)(-|$|\.)|-(wal|shm|journal)$|(^|/)uploads?/.*\.(png|jpe?g|gif|webp)$' || true)"
          if [[ -n "$blocked" ]]; then
            echo "User data must live only in the private babel-data repository:"
            echo "$blocked"
            exit 1
          fi
